name: Update Model Capabilities & Providers

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC
  workflow_dispatch:

# Prevent concurrent runs from racing.
# cancel-in-progress: false lets the in-flight run finish; the newer run
# waits. This avoids orphaned branches from cancelled jobs.
concurrency:
  group: model-capabilities-update
  cancel-in-progress: false

# These permissions apply to the default GITHUB_TOKEN.
# The workflow uses a custom PAT (MY_GITHUB_TOKEN) for PR creation;
# that token must have Contents: Read & Write + Pull requests: Read & Write
# scoped to this repo.
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Single run: --report saves the diff output, --apply writes both files
      # (assets/model_capabilities.json and assets/providers.json). This
      # avoids fetching models.dev + Gemini twice.
      - name: Check and apply updates
        id: update
        run: |
          # Exit code 1 = changes found, 0 = no changes.
          # The || true ensures the step always succeeds; gating happens
          # on the 'changed' output below.
          dart scripts/check_provider_updates.dart --report /tmp/update-report.txt --apply 2>&1 || true

          MODEL_CHANGED="false"
          PROVIDER_CHANGED="false"
          if ! git diff --quiet assets/model_capabilities.json; then MODEL_CHANGED="true"; fi
          if ! git diff --quiet assets/providers.json; then PROVIDER_CHANGED="true"; fi

          if [ "$MODEL_CHANGED" = "true" ] || [ "$PROVIDER_CHANGED" = "true" ]; then
            # Pull counts straight from the report's section headers, which the
            # script prints as "=== NEW MODELS (N) ===" / "=== NEW PROVIDERS (N) ===".
            NEW_MODELS=$(grep -oE '=== NEW MODELS \([0-9]+\) ===' /tmp/update-report.txt | grep -oE '[0-9]+' | head -1)
            UPD_MODELS=$(grep -oE '=== UPDATED MODELS \([0-9]+\) ===' /tmp/update-report.txt | grep -oE '[0-9]+' | head -1)
            NEW_PROVIDERS=$(grep -oE '=== NEW PROVIDERS \([0-9]+\) ===' /tmp/update-report.txt | grep -oE '[0-9]+' | head -1)
            UPD_PROVIDERS=$(grep -oE '=== UPDATED PROVIDERS \([0-9]+\) ===' /tmp/update-report.txt | grep -oE '[0-9]+' | head -1)
            NEW_MODELS=${NEW_MODELS:-0}
            UPD_MODELS=${UPD_MODELS:-0}
            NEW_PROVIDERS=${NEW_PROVIDERS:-0}
            UPD_PROVIDERS=${UPD_PROVIDERS:-0}

            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "model_changed=$MODEL_CHANGED" >> "$GITHUB_OUTPUT"
            echo "provider_changed=$PROVIDER_CHANGED" >> "$GITHUB_OUTPUT"
            echo "new_models=$NEW_MODELS" >> "$GITHUB_OUTPUT"
            echo "updated_models=$UPD_MODELS" >> "$GITHUB_OUTPUT"
            echo "new_providers=$NEW_PROVIDERS" >> "$GITHUB_OUTPUT"
            echo "updated_providers=$UPD_PROVIDERS" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set report output
        if: steps.update.outputs.changed == 'true'
        id: report
        run: |
          {
            # Multi-line output using GitHub's native delimiter syntax.
            echo "body<<_REPORT_EOF_"
            cat /tmp/update-report.txt
            echo "_REPORT_EOF_"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          branch: auto/model-update-${{ github.run_id }}
          delete-branch: true
          title: "chore(models): update manifests (${{ steps.update.outputs.new_models }} new models, ${{ steps.update.outputs.new_providers }} new providers)"
          body: |
            ## Automated Model & Provider Manifest Update

            This PR was generated by the weekly check against models.dev + Gemini API.

            - models: +${{ steps.update.outputs.new_models }} new, ~${{ steps.update.outputs.updated_models }} updated
            - providers: +${{ steps.update.outputs.new_providers }} new, ~${{ steps.update.outputs.updated_providers }} updated

            ```
            ${{ steps.report.outputs.body }}
            ```

            ### Reviewer Checklist
            - [ ] New models look correct (context windows, capabilities)
            - [ ] New providers look correct (names, doc URLs, max context)
            - [ ] No unwanted providers/models included
            - [ ] No downgrades detected (context/output/capabilities reduced)
            - [ ] Verify against provider documentation if unsure
          labels: |
            automated
            model-capabilities
            provider-manifest
